name: Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: novelforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
      # Unit-Tests laufen NACH dem APK-Upload: die App wird immer gebaut/geliefert,
      # eine fehlgeschlagene Assertion meldet sich trotzdem als roter Lauf.
      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
